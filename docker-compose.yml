
services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5174:5173"
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      MONGO_URI: mongodb://gamezone-mongodb-exp9:27017/GameZone
      JWT_SECRET: ${JWT_SECRET}
    extra_hosts:
      - "host.docker.internal:host-gateway"
